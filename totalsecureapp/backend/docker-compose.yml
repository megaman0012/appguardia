services:
  db:
    image: postgres:16-alpine
    container_name: ts_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-coredt360}
      POSTGRES_USER: ${DB_USERNAME:-totalsecure}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-totalsecure} -d ${DB_DATABASE:-coredt360}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ts_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      # Los limites de subida de PHP. Sin esto la imagen queda con
      # `upload_max_filesize = 2M` y el marcaje biometrico falla: una foto de
      # camara pesa mas que eso y PHP la descarta antes de que Laravel la vea.
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      # Cuantas peticiones atiende PHP a la vez. La imagen trae 5, que se agotan
      # con unas pocas tablets subiendo fotos y dejan el panel sin responder.
      - ./docker/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
    # Sin esto, un php-fpm que acepta conexiones pero no responde se queda ahi
    # para siempre: `restart: unless-stopped` solo actua si el proceso MUERE, y
    # un proceso colgado no muere.
    #
    # La comprobacion se hace con PHP y no con `/dev/tcp`: el `sh` de esta imagen
    # es dash, que no soporta esa extension de bash. Y no hay `nc`, `curl` ni
    # `cgi-fcgi` instalados. Abrir el socket 9000 es lo unico que prueba que fpm
    # sigue aceptando trabajo.
    healthcheck:
      test: ["CMD", "php", "/var/www/docker/php/healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      # ⚠️ Estaba en `local` con `APP_DEBUG: "true"`, y esto es produccion
      # expuesta en dos IP publicas. Con el modo depuracion encendido,
      # **cualquier error 500 devuelve la traza completa** con rutas del
      # servidor, la consulta SQL que fallo y, en la pagina HTML de Ignition,
      # las variables de entorno -- incluida la contraseña de la base.
      #
      # Se comprobo en esta misma sesion: cuando `/admin` fallaba, la respuesta
      # traia `"file": "/var/www/vendor/laravel/..."` y el `trace` entero.
      #
      # Ojo: estos valores **pisan al .env**, asi que cambiar solo el archivo no
      # alcanza. Es aca donde hay que ponerlos.
      APP_ENV: production
      APP_DEBUG: "false"
      # Con localhost, cualquier URL que el backend genere apunta a la maquina
      # de quien la abre. Ya rompio el logo de la hoja del QR (se resolvia por
      # `asset()` y dompdf no podia bajarlo).
      APP_URL: http://181.198.245.50:3031
      DB_CONNECTION: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-coredt360}
      DB_USERNAME: ${DB_USERNAME:-totalsecure}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      # ⚠️ Esto PISA al `.env`: lo que manda es este valor.
      #
      # Estaba en 3600 -- UNA HORA -- y Sanctum hace cumplir el `expires_at` de
      # cada token, asi que la sesion de la app caducaba de verdad: el guardia
      # recibia un 401, la app borraba la sesion y lo devolvia al login **en
      # medio de lo que estuviera haciendo**. Con turnos de 12 h, una docena de
      # veces por turno. En la base habia 25 de 27 tokens ya vencidos.
      #
      # 30 dias: la app vive en la tablet DEL PUESTO, no en un telefono
      # personal, y el marcaje sigue validando la geocerca aunque la sesion este
      # abierta.
      TOKEN_EXPIRE_IN: 2592000
      TOKEN_REFRESH_EXPIRE_IN: 3600
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ts_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3031:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:

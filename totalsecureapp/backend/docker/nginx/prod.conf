# Nginx de PRODUCCION — totalsecureapp.com (Fase de dominio)
#
# No sustituye a default.conf: el compose local sigue usando ese en el 3031.
# Este se monta solo con docker-compose.prod.yml.
#
# Dos hosts virtuales sobre el mismo backend, como quedo definido el 18/08:
#   totalsecureapp.com      -> panel web (Filament + web legacy)
#   api.totalsecureapp.com  -> API (app movil y portal cliente)

# ── Redireccion HTTP -> HTTPS ──
# Deja pasar /.well-known/acme-challenge para que certbot pueda renovar sin
# tumbar el sitio.
server {
    listen 80;
    server_name totalsecureapp.com www.totalsecureapp.com api.totalsecureapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Panel web ──
server {
    listen 443 ssl http2;
    server_name totalsecureapp.com www.totalsecureapp.com;

    ssl_certificate     /etc/letsencrypt/live/totalsecureapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/totalsecureapp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;
    # Las fotos de rondas y accesos llegan en multipart; 64M es el limite actual.
    client_max_body_size 64M;

    # HSTS: solo cuando el certificado ya funciona. Si se activa antes, el
    # navegador recuerda el https y no se puede volver a http para depurar.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # Sin esto Laravel genera URLs http:// detras del proxy.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ── API ──
server {
    listen 443 ssl http2;
    server_name api.totalsecureapp.com;

    ssl_certificate     /etc/letsencrypt/live/totalsecureapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/totalsecureapp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # El panel no se sirve por el subdominio de la API.
    location /admin  { return 404; }
    location /acceso { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\. { deny all; }
}

# Nginx DEL CONTENEDOR (ts_nginx, publicado en el 3031).
#
# ⚠️ Este es el que ven las TABLETS. `app.json` las apunta a
# `http://<ip publica>:3031`, o sea directo acá, salteándose el nginx del host.
# Todo lo que se quiera aplicar a la app móvil va en este archivo, no en
# /etc/nginx/conf.d/totalsecureapp.conf.
server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # ─────────────────────────────────────────────────────────────────────
    # COMPRESIÓN
    #
    # Venía apagada (el `#gzip on;` comentado de nginx.conf), y era la mejora
    # más grande y más barata que tenía el sitio. Medido activo por activo:
    #
    #   adminlte.min.css (login)        1.396 KB -> 124 KB   (11,3x)
    #   app.css (panel Filament)          621 KB ->  63 KB    (9,8x)
    #   support.js                        145 KB ->  50 KB    (2,9x)
    #   jquery + bootstrap + adminlte.js  219 KB ->  64 KB
    #   el HTML del panel                 284 a 442 KB, comprime ~8x
    #
    # En total la primera carga del panel baja de ~785 KB a ~120 KB y la del
    # login de ~1,7 MB a ~200 KB. En una tablet con datos móviles en una garita,
    # eso es la diferencia entre entrar y quedarse mirando la pantalla.
    #
    # Sobre BREACH: comprimir respuestas con secretos es un riesgo cuando hay
    # TLS. Acá se sirve HTTP en claro, así que no hay nada que proteger que no
    # esté ya expuesto. Cuando haya dominio y certificado, revisar esto.
    gzip              on;
    gzip_vary         on;          # imprescindible: hay proxy delante
    gzip_proxied      any;
    gzip_comp_level   5;           # 9 cuesta bastante CPU para ~2% más
    gzip_min_length   1024;        # comprimir 200 bytes cuesta más que enviarlos
    # `text/html` NO va acá: nginx siempre lo comprime cuando gzip está on, y
    # repetirlo hace que avise por duplicado al arrancar.
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/rss+xml
        image/svg+xml
        font/ttf font/otf application/vnd.ms-fontobject;

    # ─────────────────────────────────────────────────────────────────────
    # CACHE DE ACTIVOS
    #
    # Antes no salía ningún `Cache-Control`: solo `ETag`, así que el navegador
    # revalidaba CADA archivo en CADA carga. Son entre 8 y 12 viajes de ida y
    # vuelta antes de dibujar nada.

    # Los de Filament llevan `?v=5.8.1.0` en la URL, y `filament:assets` los
    # regenera al subir de versión: la propia versión invalida la cache, así que
    # un año es seguro. Lo mismo las tipografías.
    location ~* ^/(css|js|fonts)/filament/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # AdminLTE es de terceros y no se edita nunca. Son 7 MB en disco y ~1,6 MB
    # por carga del login.
    location ^~ /AdminLTE320/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Las fotos de marcajes, rondas y accesos. El nombre lleva el sello de
    # tiempo, así que una foto nunca cambia de contenido; y los listados del
    # panel muestran 25 miniaturas por página, hoy descargadas de nuevo cada vez.
    location ^~ /images/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ⚠️ El CSS y JS PROPIOS (general.css, components.css, modules/acceso/*) NO
    # llevan versión ni hash en la URL. Con cache larga, editar el login dejaría
    # a la gente con la hoja de estilos vieja y sin forma de forzar la recarga.
    # Se deja revalidando, que es lo que ya hacía, pero dicho explícitamente.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

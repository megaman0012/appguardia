; Limites de subida para las fotos de evidencia.
;
; ⚠️ Sin este archivo PHP queda con su valor de fabrica, `upload_max_filesize = 2M`,
; y **eso rompia el marcaje biometrico**: la camara de una tablet saca fotos de
; 3 a 5 MB, PHP descartaba el archivo antes de que Laravel lo viera y la
; validacion respondia «el archivo no se pudo cargar». El guardia veia un error
; de subida sin saber que el problema era el tamaño.
;
; nginx ya permitia 64M en los dos vhost, asi que el cuello estaba solo aca.
;
; 16M deja margen de sobra para una foto de camara sin comprimir. La app ademas
; las comprime antes de enviarlas, asi que en la practica pesan bastante menos;
; el margen es para que un dispositivo distinto no vuelva a romper el marcaje.
upload_max_filesize = 16M

; Tiene que ser MAYOR que upload_max_filesize: engloba todo el cuerpo del POST,
; que ademas de la foto lleva las coordenadas, el uuid y la fecha del evento.
post_max_size = 20M

; Una foto grande en memoria mientras se procesa.
memory_limit = 512M

; Una red de sitio puede ser lenta: subir 5 MB por 3G tarda.
max_execution_time = 120

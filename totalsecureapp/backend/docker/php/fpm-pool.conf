; Cuantas peticiones puede atender PHP a la vez.
;
; ⚠️ La imagen de php-fpm trae `pm.max_children = 5`, y este proyecto nunca lo
; cambio: **cinco peticiones simultaneas en todo el sistema**.
;
; Para este caso de uso es poco y se nota justo cuando peor viene. Una tablet
; subiendo la foto de un marcaje ocupa un worker durante todo lo que tarde la
; subida --por la red de una garita, segundos o minutos--, y los cambios de turno
; concentran las marcaciones de muchos puestos en la misma franja. Con cinco
; workers ocupados en subidas, **el panel web deja de responder para todos**: no
; es que vaya lento, es que las peticiones quedan encoladas.
;
; 20 workers, medidos contra este servidor: 14 GB de RAM, 4 CPUs, y el
; contenedor usa 132 MB con los cinco actuales. Aun contando ~100 MB por worker
; bajo carga real, son ~2 GB en el peor caso, con los otros proyectos del
; servidor ya descontados.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recicla el worker cada 500 peticiones. Es la red contra una fuga de memoria
; lenta: sin esto, un worker que crece no vuelve a soltar lo que tomo.
pm.max_requests = 500

; Deja ver en el log que peticion se quedo colgada, en vez de adivinarlo.
; Es la mitad del tiempo de `max_execution_time`, asi que avisa antes de que PHP
; la corte.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 60s

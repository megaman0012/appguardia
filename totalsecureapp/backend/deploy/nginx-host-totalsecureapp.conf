# Vhost del nginx DEL HOST para Total Secure App.
# Destino: /etc/nginx/conf.d/totalsecureapp.conf   (copiar, no simbolico:
# SELinux impide a nginx seguir enlaces al home del usuario)
#
# POR QUE EL NGINX DEL HOST Y NO EL DEL CONTENEDOR
# El servidor ya reparte el puerto 80 por nombre entre varios proyectos
# (servidesk -> 3011, tecdesk -> 3001). Este vhost es el tercero. El nginx del
# contenedor (ts_nginx, puerto 3031) sigue existiendo y sirviendo PHP; aqui solo
# se reenvia. Dos capas de nginx suena redundante pero no lo es: la de arriba es
# la unica puerta publica y el unico lugar donde viven TLS, limites y logs.
#
# NO lleva default_server: ese lo tiene el bloque `_` de nginx.conf. Declarar un
# segundo default_server en el mismo listen impide arrancar nginx entero, y con
# el se caerian tambien los otros proyectos.
#
# SE RESPONDE POR IP a proposito. Todavia no hay dominio, asi que el APK apunta
# a la IP publica y manda `Host: <ip>`; nginx casa por server_name igual que con
# un nombre. Estan las DOS IPs publicas porque cual de las dos reenvia el router
# es una decision que se toma afuera de este servidor, y asi funciona con
# cualquiera. La IP LAN queda para las tablets dentro de la red.
server {
    listen 80;
    server_name 181.188.232.50 181.198.245.50 192.168.3.124;

    # Cuando haya dominio, agregarlo arriba y sacar las IPs. Ver
    # DESPLIEGUE-IP-Y-PUERTO-80.md: con dominio se puede emitir certificado y
    # dejar de mandar cedulas y contrasenas en claro.

    # La app sube fotos en cada marcaje, acceso y novedad. El limite por defecto
    # del host es 1 MB: sin esto, una foto de camara responde 413 y el guardia ve
    # "error al cargar imagen" sin mas explicacion. 64m iguala al del contenedor.
    client_max_body_size 64m;

    access_log /var/log/nginx/totalsecureapp-access.log;
    error_log  /var/log/nginx/totalsecureapp-error.log;

    location / {
        proxy_pass         http://127.0.0.1:3031;
        proxy_http_version 1.1;

        # Host real: Laravel arma con esto el enlace del correo de cambio de
        # contrasena (url('/')). Con $proxy_host saldria "127.0.0.1" y el enlace
        # no le serviria a nadie.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Subir una foto por una red movil mala tarda. Con los 60 s por defecto
        # el marcaje se corta a medias.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
